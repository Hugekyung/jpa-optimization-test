spring:
  application:
    name: jpa-query-optimization-test
  datasource:
    url: jdbc:h2:mem:jpaquery;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 10
        generate_statistics: true
        session_factory:
          statement_inspector: com.example.jpaquery.config.SqlQueryTracker
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
